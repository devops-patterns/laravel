name: ci

# Единая точка входа. Все реальные триггеры — здесь; листовые workflow'ы
# (lint/tests/build/deploy-*) переведены в workflow_call и вызываются как jobs.
# Один прогон = одна цепочка, из веб-морды запускается одной кнопкой (Run workflow).
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: "Что сделать (checks — только проверки)"
        type: choice
        options: [checks, staging, production]
        default: checks
      mode:
        description: "production: deploy (вверх, БД не трогаем) / rollback (вниз, восстановить БД версии)"
        type: choice
        options: [deploy, rollback]
        default: deploy
      ref:
        description: "Для target=production (обязателен): версия существующего образа, напр. v1.2.3"
        type: string
        required: false

concurrency:
  # PR-прогоны отменяем при новом пуше; деплой-прогоны (push/tag/dispatch) — нет.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  # ── Проверки (всегда: PR, push, dispatch) ────────────────────────────────
  # needs: [prepare] — не гоняем линт/тесты, если prepare упал (нет ref / запрет
  # направления версии): fail-fast до затрат на проверки.
  lint:
    needs: [prepare]
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  test:
    needs: [prepare]
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  # Первым в графе (lint/test/build → needs: prepare). Готовит теги для production
  # и жёстко гейтит НАПРАВЛЕНИЕ версии до затрат на проверки: deploy — только вверх,
  # rollback — только вниз. Работает и когда build пропущен (раскат готового образа).
  prepare:
    runs-on: self-hosted
    outputs:
      prod_image_tag: ${{ steps.p.outputs.prod_image_tag }}
      prod_release_tag: ${{ steps.p.outputs.prod_release_tag }}
      rollback_to: ${{ steps.p.outputs.rollback_to }}
      prod_deploy: ${{ steps.p.outputs.prod_deploy }}
      direction: ${{ steps.p.outputs.direction }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
          REF_INPUT: ${{ inputs.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DIRECTION=""; ROLLBACK=""; PROD_DEPLOY=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$TARGET" = "production" ]; then
            REL="$REF_INPUT"
            if [ -z "$REL" ]; then
              echo "ERROR: для target=production нужен ref (напр. v1.2.3)" >&2
              exit 1
            fi
            PROD_DEPLOY=true
            if [ "$MODE" = "rollback" ]; then
              DIRECTION=rollback; ROLLBACK="$REL"   # rollback → восстановить БД версии
            else
              DIRECTION=deploy                       # deploy → БД не трогаем
            fi
          elif [ "$REF_TYPE" = "tag" ]; then
            REL="$REF_NAME"; PROD_DEPLOY=true; DIRECTION=deploy
          else
            REL=""
          fi
          {
            echo "prod_release_tag=$REL"
            echo "prod_image_tag=${REL#v}"
            echo "rollback_to=$ROLLBACK"
            echo "prod_deploy=$PROD_DEPLOY"
            echo "direction=$DIRECTION"
          } >> "$GITHUB_OUTPUT"

      # Жёсткий гейт направления: текущую версию знает только прод-хост → ssh.
      # deploy только вверх (== ок, редеплой), rollback только строго вниз.
      - name: Guard version direction
        if: ${{ steps.p.outputs.prod_deploy == 'true' }}
        uses: appleboy/ssh-action@v1
        env:
          NEW_VER: ${{ steps.p.outputs.prod_image_tag }}
          DIRECTION: ${{ steps.p.outputs.direction }}
        with:
          host: ${{ vars.PROD_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          port: ${{ vars.SSH_PORT }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          envs: NEW_VER,DIRECTION
          script: |
            set -euo pipefail
            CUR_IMG=$(docker service inspect laravel_app \
              --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null || true)
            CUR_IMG=${CUR_IMG%@*}; CUR_VER=${CUR_IMG##*:}
            if ! printf '%s' "$CUR_VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              if [ "$DIRECTION" = rollback ]; then
                echo "ERROR: нет работающей semver-версии — откатывать не от чего" >&2
                exit 1
              fi
              echo "первый деплой (текущая '$CUR_VER') — проверку направления пропускаю"
              exit 0
            fi
            if [ "$DIRECTION" = rollback ]; then
              if ! dpkg --compare-versions "$NEW_VER" lt "$CUR_VER"; then
                echo "ERROR: rollback только на версию ниже текущей ($NEW_VER >= $CUR_VER). Вперёд — mode=deploy." >&2
                exit 1
              fi
            else
              if dpkg --compare-versions "$NEW_VER" lt "$CUR_VER"; then
                echo "ERROR: понижение запрещено ($NEW_VER < $CUR_VER). Для отката — mode=rollback." >&2
                exit 1
              fi
            fi
            echo "direction ok: $DIRECTION $NEW_VER vs $CUR_VER"

  # ── Сборка образа ────────────────────────────────────────────────────────
  # Только после зелёных проверок. Пропускается на PR, на dispatch=checks и на
  # dispatch=production (откат катит уже собранный образ — пересборка не нужна).
  build:
    needs: [prepare, lint, test]
    if: >-
      ${{ github.event_name != 'pull_request'
          && !(github.event_name == 'workflow_dispatch' && inputs.target == 'checks')
          && !(github.event_name == 'workflow_dispatch' && inputs.target == 'production') }}
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # ── Деплой staging ───────────────────────────────────────────────────────
  # push в master или ручной dispatch target=staging. Катит свежесобранный sha-образ.
  deploy-staging:
    needs: [build]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
          && ( (github.event_name == 'push' && github.ref == 'refs/heads/master')
               || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging') ) }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-staging.yml
    with:
      image_tag: ${{ needs.build.outputs.sha_tag }}
    secrets: inherit

  # ── Деплой production ────────────────────────────────────────────────────
  # тег v* (build → deploy) ИЛИ dispatch target=production+ref (откат/раскат
  # существующего образа, build пропущен). Апрув — через environment: production
  # в самом deploy-production.yml. build.result != 'failure' пропускает skipped(откат).
  deploy-production:
    needs: [prepare, build]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' && needs.build.result != 'failure'
          && ( (github.event_name == 'push' && github.ref_type == 'tag')
               || (github.event_name == 'workflow_dispatch' && inputs.target == 'production') ) }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-production.yml
    with:
      image_tag: ${{ needs.prepare.outputs.prod_image_tag }}
      release_tag: ${{ needs.prepare.outputs.prod_release_tag }}
      rollback_to: ${{ needs.prepare.outputs.rollback_to }}
    secrets: inherit
