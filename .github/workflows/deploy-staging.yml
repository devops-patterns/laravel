name: deploy-staging

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Determine image SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          APP_NAME: ${{ vars.APP_NAME }}
          APP_ENV: ${{ vars.APP_ENV }}
          APP_DEBUG: ${{ vars.APP_DEBUG }}
          APP_URL: ${{ vars.APP_URL }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          IMAGE_TAG: sha-${{ steps.sha.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          port: ${{ vars.SSH_PORT }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          envs: APP_KEY,DB_PASSWORD,REDIS_PASSWORD,APP_NAME,APP_ENV,APP_DEBUG,APP_URL,LOG_LEVEL,IMAGE_TAG,GH_TOKEN
          script: |
            set -euo pipefail
            cd /opt/stacks/laravel

            echo "$GH_TOKEN" | docker login ghcr.io -u github-actions --password-stdin

            IMAGE="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
            echo "Deploying: $IMAGE"
            docker pull "$IMAGE"

            # Секреты — создаются при первом деплое, при повторных игнорируются
            printf '%s' "$APP_KEY" | docker secret create laravel_app_key - 2>/dev/null || true
            printf '%s' "$DB_PASSWORD" | docker secret create laravel_db_password - 2>/dev/null || true
            printf '%s' "$REDIS_PASSWORD" | docker secret create laravel_redis_password - 2>/dev/null || true

            # Первый деплой — развернуть стек целиком и выйти (миграции запустит
            # сам контейнер, flag обслуживания не нужен)
            if ! docker stack ls --format '{{.Name}}' | grep -q '^laravel$'; then
              export IMAGE_TAG APP_NAME APP_ENV APP_DEBUG APP_URL LOG_LEVEL
              docker stack deploy -c docker-compose.yml --with-registry-auth laravel
              echo "Initial stack deploy complete"
              exit 0
            fi

            # ── helpers ──────────────────────────────────────────────────
            app_container() {
              docker ps -qf name=laravel_app --filter status=running | head -n1
            }

            wait_service_running() {
              # Ждём, пока у сервиса появится running-task с нужным образом.
              local svc="$1" img="$2"
              for i in $(seq 1 60); do
                if docker service ps "$svc" \
                    --filter desired-state=running \
                    --format '{{.Image}} {{.CurrentState}}' \
                    | grep -q "^${img} Running"; then
                  return 0
                fi
                sleep 2
              done
              echo "ERROR: $svc не перешёл в Running с $img за 120s" >&2
              docker service ps "$svc" --no-trunc >&2
              return 1
            }

            DOMAIN="${APP_URL#*://}"
            DOMAIN="${DOMAIN%%/*}"

            probe_up() {
              # Проверяем /up через Traefik (localhost:443 + Host-header),
              # -k на случай если сертификат ещё не выпущен.
              curl -fsSL -k --max-time 3 \
                -H "Host: ${DOMAIN}" \
                -o /dev/null \
                "https://localhost/up"
            }

            # ── 1. Останавливаем воркеры (grace 120s из compose) ─────────
            echo "→ Stopping workers"
            docker service scale laravel_worker=0 laravel_scheduler=0

            # ── 2. Режим обслуживания (флаг в Redis, виден всем репликам) ─
            CID=$(app_container)
            if [ -n "$CID" ]; then
              echo "→ Enabling maintenance"
              docker exec "$CID" php artisan down --render="errors::503" || true
            fi

            # ── 3. Rolling update app (start-first из compose) ───────────
            echo "→ Updating app image"
            docker service update \
              --with-registry-auth \
              --image "$IMAGE" \
              laravel_app

            wait_service_running laravel_app "$IMAGE"

            # ── 4. Миграции на новой схеме ───────────────────────────────
            CID=$(app_container)
            if [ -z "$CID" ]; then
              echo "ERROR: не найден работающий контейнер laravel_app" >&2
              exit 1
            fi
            echo "→ Running migrations"
            docker exec "$CID" php artisan migrate --force

            # ── 5. Обновляем образы воркера/планировщика ─────────────────
            echo "→ Updating worker/scheduler images"
            docker service update --with-registry-auth --image "$IMAGE" laravel_worker
            docker service update --with-registry-auth --image "$IMAGE" laravel_scheduler

            # ── 6. Возвращаем воркеров ───────────────────────────────────
            docker service scale laravel_worker=1 laravel_scheduler=1

            # ── 7. Проверяем доступность /up через Traefik ───────────────
            echo "→ Waiting for /up via Traefik"
            for i in $(seq 1 30); do
              if probe_up; then
                echo "  /up ok"
                break
              fi
              sleep 2
            done

            # ── 8. Снимаем режим обслуживания (флаг удаляется из Redis) ──
            CID=$(app_container)
            echo "→ Disabling maintenance"
            docker exec "$CID" php artisan up

            # ── 9. Чистим кеш уже после `up`, чтобы не стереть флаг ──────
            echo "→ Clearing cache"
            docker exec "$CID" php artisan cache:clear

            echo "✓ Staging deploy complete"
