name: build

# Reusable-компонент: вызывается только оркестратором ci.yml (workflow_call).
# Отдаёт теги собранного образа, чтобы deploy-jobs знали, что тянуть, — без workflow_run.
on:
  workflow_call:
    outputs:
      sha_tag:
        description: "Полный тег образа по git-sha (sha-<sha>) — для staging."
        value: ${{ jobs.build-push.outputs.sha_tag }}
      version_tag:
        description: "Semver-тег образа (<version>) для тегов v*, иначе пусто — для production."
        value: ${{ jobs.build-push.outputs.version_tag }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
      version_tag: ${{ steps.tags.outputs.version_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=staging,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Теги образа для оркестратора: sha_tag тянет staging, version_tag (<version>
      # без 'v') — production. Совпадают со схемой docker/metadata-action выше.
      - name: Expose image tags
        id: tags
        run: |
          echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=" >> "$GITHUB_OUTPUT"
          fi
