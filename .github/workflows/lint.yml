name: linter

# Reusable-компонент: вызывается только оркестратором ci.yml (workflow_call).
# Прямых триггеров нет — все триггеры на ci.yml, чтобы не было двойных прогонов.
on:
  workflow_call:

# contents: read — авто-коммит правок стиля отключён (шаг ниже закомментирован);
# как reusable-workflow нельзя просить прав больше, чем выдаёт caller (ci.yml).
permissions:
  contents: read

jobs:
  quality:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      - name: Run Pint
        run: composer lint

      - name: Format Frontend
        run: npm run format

      - name: Lint Frontend
        run: npm run lint

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v7
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
