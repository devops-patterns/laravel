name: deploy-production

on:
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (e.g. v1.2.3)"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout (нужны deploy/docker-compose.yml и deploy/.env.base)
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi

          if [ -z "$TAG" ]; then
            echo "ERROR: tag is empty" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      # Версионируемые артефакты доставляем на сервер каждым деплоем (single source
      # of truth — git). scp-action сам создаёт целевой каталог.
      - name: Ship compose and env base
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.PROD_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          port: ${{ vars.SSH_PORT }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.yml,deploy/.env.base"
          target: /opt/stacks/laravel/
          strip_components: 1

      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_TAG: ${{ steps.tag.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          APP_ENV: ${{ vars.APP_ENV }}
          APP_DEBUG: ${{ vars.APP_DEBUG }}
          APP_URL: ${{ vars.APP_URL }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
        with:
          host: ${{ vars.PROD_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          port: ${{ vars.SSH_PORT }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          envs: TAG,IMAGE_TAG,GH_TOKEN,APP_KEY,DB_PASSWORD,REDIS_PASSWORD,APP_ENV,APP_DEBUG,APP_URL,LOG_LEVEL
          script: |
            set -euo pipefail
            cd /opt/stacks/laravel

            echo "$GH_TOKEN" | docker login ghcr.io -u github-actions --password-stdin

            IMAGE="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
            echo "Deploying: $IMAGE ($TAG)"
            docker pull "$IMAGE"

            : "${APP_KEY:?APP_KEY пуст (GitHub secret)}"
            : "${APP_URL:?APP_URL пуст (GitHub var)}"

            # Финальный .env = статичная база + значения из GitHub vars/secrets.
            # Это ЕДИНСТВЕННЫЙ источник конфига, монтируется в /app/.env.
            umask 077
            {
              cat .env.base
              echo
              echo "APP_ENV=${APP_ENV}"
              echo "APP_DEBUG=${APP_DEBUG}"
              echo "APP_URL=${APP_URL}"
              echo "APP_KEY=${APP_KEY}"
              echo "LOG_LEVEL=${LOG_LEVEL}"
              echo "DB_PASSWORD=${DB_PASSWORD}"
              echo "REDIS_PASSWORD=${REDIS_PASSWORD}"
            } > .env.assembled

            # Версия конфига = хэш содержимого: тот же .env → тот же секрет
            # (идемпотентно), изменил → новое имя → Swarm катит новый конфиг.
            ENV_VERSION=$(sha256sum .env.assembled | cut -c1-12)

            # .env-секрет версионирован. Пароли БД/redis — один раз (иммутабельны;
            # смена пароля БД — ALTER USER, не пересоздание секрета).
            docker secret inspect "laravel_env_${ENV_VERSION}" >/dev/null 2>&1 || \
              docker secret create "laravel_env_${ENV_VERSION}" .env.assembled
            docker secret inspect laravel_db_password >/dev/null 2>&1 || \
              printf '%s' "$DB_PASSWORD" | docker secret create laravel_db_password -
            docker secret inspect laravel_redis_password >/dev/null 2>&1 || \
              printf '%s' "$REDIS_PASSWORD" | docker secret create laravel_redis_password -

            rm -f .env.assembled

            # Для compose (POSTGRES_DB/USER + healthcheck) — из .env.base.
            DB_DATABASE=$(grep -E '^DB_DATABASE=' .env.base | head -n1 | cut -d= -f2-)
            DB_USERNAME=$(grep -E '^DB_USERNAME=' .env.base | head -n1 | cut -d= -f2-)
            : "${DB_DATABASE:?DB_DATABASE не задан в .env.base}"
            : "${DB_USERNAME:?DB_USERNAME не задан в .env.base}"

            # APP_DOMAIN для traefik-лейбла — из APP_URL (единый источник).
            APP_DOMAIN="${APP_URL#*://}"; APP_DOMAIN="${APP_DOMAIN%%/*}"
            export IMAGE_TAG ENV_VERSION APP_DOMAIN DB_DATABASE DB_USERNAME

            # ── helpers ──────────────────────────────────────────────────
            app_container() { docker ps -qf name=laravel_app --filter status=running | head -n1; }
            db_container()  { docker ps -qf name=laravel_db  --filter status=running | head -n1; }
            wait_db_ready() {
              # Пробиваем db:5432 ИЗ КОНТЕЙНЕРА APP — ровно оттуда, откуда идут
              # миграции. pg_isready внутри db-контейнера сказал бы лишь, что postgres
              # поднялся локально, но не что app уже резолвит имя "db" в overlay-сети:
              # на свежем стеке DNS-регистрация имени отстаёт на пару секунд. fsockopen
              # проверяет и резолв имени, и доступность TCP-порта разом.
              local cid; cid=$(app_container)
              [ -n "$cid" ] || { echo "ERROR: нет работающего laravel_app" >&2; return 1; }
              for i in $(seq 1 90); do
                if docker exec "$cid" php -r 'exit(@fsockopen("db",5432,$e,$s,2)?0:1);' 2>/dev/null; then
                  return 0
                fi
                sleep 2
              done
              echo "ERROR: app не смог подключиться к db:5432 за 180s" >&2
              docker service ps laravel_db --no-trunc >&2
              return 1
            }
            wait_service_running() {
              local svc="$1" img="$2"
              for i in $(seq 1 60); do
                if docker service ps "$svc" --filter desired-state=running \
                    --format '{{.Image}} {{.CurrentState}}' | grep -q "^${img} Running"; then
                  return 0
                fi
                sleep 2
              done
              echo "ERROR: $svc не перешёл в Running с $img за 120s" >&2
              docker service ps "$svc" --no-trunc >&2
              return 1
            }
            probe_up() {
              curl -fsSL -k --max-time 3 -H "Host: ${APP_DOMAIN}" -o /dev/null "https://localhost/up"
            }

            # ── Pre-deploy бэкап БД (best-effort) ────────────────────────
            # Скрипт gitops /opt/backups/bin/run-backup.sh <project> крутится под
            # root (docker + borg-ключ в /root/.ssh) → нужен sudo. Релиз не
            # блокируем: cron borgmatic и так снимает по расписанию.
            DB_CID=$(db_container)
            if [ -n "$DB_CID" ] && docker exec "$DB_CID" pg_isready -q 2>/dev/null; then
              echo "→ Running pre-deploy backup"
              sudo -n /opt/backups/bin/run-backup.sh laravel \
                || echo "WARNING: pre-deploy бэкап не выполнен (нет sudo/скрипта) — продолжаю"
            fi

            STACK_EXISTS=0
            docker stack ls --format '{{.Name}}' | grep -q '^laravel$' && STACK_EXISTS=1

            # Режим обслуживания ДО раската (флаг в Redis виден и новым таскам).
            if [ "$STACK_EXISTS" = 1 ]; then
              CID=$(app_container)
              if [ -n "$CID" ]; then
                echo "→ Enabling maintenance"
                docker exec "$CID" php artisan down --render="errors::503" || true
              fi
            fi

            # Полный раскат: новый образ + новая версия .env-секрета. Только
            # stack deploy подхватывает смену секрета (service update — нет).
            # start-first из compose даёт zero-downtime.
            echo "→ docker stack deploy"
            docker stack deploy -c docker-compose.yml --with-registry-auth laravel

            echo "→ Waiting for laravel_app on new image"
            wait_service_running laravel_app "$IMAGE"

            echo "→ Waiting for laravel_db to accept connections"
            wait_db_ready

            # Миграции на новой схеме, в новом контейнере (один раз, не в воркерах).
            CID=$(app_container)
            [ -n "$CID" ] || { echo "ERROR: нет работающего laravel_app" >&2; exit 1; }
            echo "→ Running migrations"
            docker exec "$CID" php artisan migrate --force

            echo "→ Waiting for /up via Traefik"
            for i in $(seq 1 30); do probe_up && { echo "  /up ok"; break; }; sleep 2; done

            # Снять обслуживание (если включали) и подчистить кеш ПОСЛЕ up.
            CID=$(app_container)
            if [ "$STACK_EXISTS" = 1 ]; then
              echo "→ Disabling maintenance"
              docker exec "$CID" php artisan up
            fi
            docker exec "$CID" php artisan cache:clear || true

            # Уборка старых env-секретов (текущий пропускаем; used → rm падает).
            docker secret ls --filter name=laravel_env_ --format '{{.Name}}' | while read -r s; do
              [ "$s" = "laravel_env_${ENV_VERSION}" ] && continue
              docker secret rm "$s" >/dev/null 2>&1 || true
            done

            echo "✓ Production deploy complete: $TAG (env ${ENV_VERSION}, image ${IMAGE})"
